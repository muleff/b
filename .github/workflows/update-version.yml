name: Update WhatsApp Version

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-whatsapp-version
  cancel-in-progress: false

jobs:
  update-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Update WhatsApp Web Version
        id: update_version
        run: node update-version.js

      - name: Validate updated files
        if: steps.update_version.outputs.updated == 'true'
        run: |
          node --check lib/Defaults/index.js
          node --check lib/Utils/generics.js
          npm run lint
          npm test
          npm run build

      - name: Commit and push to default branch
        if: steps.update_version.outputs.updated == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WHATSAPP_VERSION: ${{ steps.update_version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/Defaults/index.js lib/Utils/generics.js
          if git diff --cached --quiet; then
            echo "WhatsApp Web version is already up to date."
            exit 0
          fi
          git commit -m "chore: update WhatsApp Web version to $WHATSAPP_VERSION"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
